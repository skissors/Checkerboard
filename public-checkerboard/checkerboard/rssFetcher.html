<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>nekOS rss fetcher</title>
	</head>
	<body>
		<script>
			window.addEventListener("message", idListener);

			function idListener(e) {
				let data = JSON.parse(e.data);
				if (data.id) {
					getLatestRSSUpdate("./feed.xml", data.id, e.source);
				}
			}

			function getLatestRSSUpdate(rssUrl, id, source) {
				fetch(rssUrl)
					.then((response) => response.text())
					.then((str) => new window.DOMParser().parseFromString(str, "text/xml"))
					.then((data) => {
						console.log(data);
						let items = data.querySelectorAll("item");
						let latestUpdate = items[0];

						let latestUpdateData = {
							id: id,
							date: new Date(latestUpdate.querySelector("pubDate").innerHTML),
							description: latestUpdate.querySelector("description").innerHTML,
						};
						console.log("sending latest update", latestUpdateData);
						source.postMessage(JSON.stringify(latestUpdateData), "*");
					});
			}
		</script>
	</body>
</html>
